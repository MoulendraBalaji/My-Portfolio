<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Kept in sync with `meta` in src/data/portfolio.js, which rewrites these
         at runtime. Static tags matter because most crawlers do not run JS. -->
    <title>Moulendra Balaji — AI Engineer</title>
    <meta
      name="description"
      content="AI Engineer specializing in ML, Deep Learning, and Web Development. Building end-to-end AI solutions and scalable user interfaces."
    />
    <meta name="author" content="Moulendra Balaji" />
    <link rel="canonical" href="https://moulendrabalajiportfolio.vercel.app/" />

    <meta name="theme-color" content="#07080B" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moulendra Balaji" />
    <meta property="og:url" content="https://moulendrabalajiportfolio.vercel.app/" />
    <meta property="og:title" content="Moulendra Balaji — AI Engineer" />
    <meta
      property="og:description"
      content="AI Engineer specializing in ML, Deep Learning, and Web Development. Building end-to-end AI solutions and scalable user interfaces."
    />
    <meta property="og:image" content="https://moulendrabalajiportfolio.vercel.app/images/brand/og-cover.png" />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Moulendra Balaji — AI Engineer, machine learning and research"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moulendra Balaji — AI Engineer" />
    <meta
      name="twitter:description"
      content="AI Engineer specializing in ML, Deep Learning, and Web Development. Building end-to-end AI solutions and scalable user interfaces."
    />
    <meta
      name="twitter:image"
      content="https://moulendrabalajiportfolio.vercel.app/images/brand/og-cover.png"
    />
    <meta name="twitter:image:alt" content="Moulendra Balaji — AI Engineer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
